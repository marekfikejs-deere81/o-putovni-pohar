name: API server (Cloudflare Worker)

# Test: automaticky po změně worker/ nebo shared/ na main.
# Produkce: jen ručně (Actions → API server → Run workflow → production).
on:
  push:
    branches: [main]
    paths: ['worker/**', 'shared/**', 'package-lock.json', '.github/workflows/worker.yml']
  workflow_dispatch:
    inputs:
      target:
        description: 'Cíl nasazení'
        type: choice
        options: [test, production]
        default: test

permissions:
  contents: read

concurrency:
  group: worker-${{ inputs.target || 'test' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target == 'production' && 'production' || 'test' }}
    env:
      TARGET: ${{ inputs.target || 'test' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Diagnostika tokenu (bez vypsání hodnoty)
        run: |
          T="$CLOUDFLARE_API_TOKEN"
          echo "délka: ${#T}"
          case "$T" in *[[:space:]]*) echo "::warning::Token obsahuje mezeru nebo konec řádku";; esac
          printf 'začíná na: %s…\n' "$(printf '%s' "$T" | cut -c1-4)"
          echo "--- /user/tokens/verify"
          curl -s -H "Authorization: Bearer $T" https://api.cloudflare.com/client/v4/user/tokens/verify | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("success"),d.get("errors"),(d.get("result") or {}).get("status"))'
          echo "--- token id (není tajné):"
          curl -s -H "Authorization: Bearer $T" https://api.cloudflare.com/client/v4/user/tokens/verify | python3 -c 'import sys,json;d=json.load(sys.stdin);r=d.get("result") or {};print(r.get("id"),r.get("expires_on"),r.get("not_before"))'
          echo "--- /accounts"
          curl -s -H "Authorization: Bearer $T" https://api.cloudflare.com/client/v4/accounts | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("success"),d.get("errors"),[a.get("id") for a in d.get("result") or []])'
          echo "--- /accounts/<id>/workers/scripts"
          curl -s -H "Authorization: Bearer $T" https://api.cloudflare.com/client/v4/accounts/56139aff8f3da503f6c2610b2d545ba7/workers/scripts | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("success"),d.get("errors"))'

      - name: Nasazení Workeru
        working-directory: worker
        run: |
          if [ "$TARGET" = "production" ]; then ENVFLAG="--env production"; else ENVFLAG=""; fi
          npx wrangler deploy $ENVFLAG

      - name: Tajemství Workeru (DATABASE_URL)
        working-directory: worker
        env:
          DB_URL: ${{ inputs.target == 'production' && secrets.NEON_PROD_RUNTIME_URL || secrets.NEON_TEST_RUNTIME_URL }}
        run: |
          if [ -z "$DB_URL" ]; then echo "::error::Chybí runtime připojení k databázi v GitHub Secrets."; exit 1; fi
          case "$DB_URL" in postgresql://app_runtime:*) ;; *) echo "::error::Runtime připojení musí používat roli app_runtime."; exit 1;; esac
          if [ "$TARGET" = "production" ]; then ENVFLAG="--env production"; else ENVFLAG=""; fi
          printf '%s' "$DB_URL" | npx wrangler secret put DATABASE_URL $ENVFLAG

      - name: Tajemství Workeru (Google OAuth, šifrovací klíč)
        working-directory: worker
        env:
          GID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GSECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ "$TARGET" = "production" ]; then ENVFLAG="--env production"; else ENVFLAG=""; fi
          if [ -n "$GID" ] && [ -n "$GSECRET" ]; then
            printf '%s' "$GID" | npx wrangler secret put GOOGLE_CLIENT_ID $ENVFLAG
            printf '%s' "$GSECRET" | npx wrangler secret put GOOGLE_CLIENT_SECRET $ENVFLAG
          else
            echo "::notice::Google OAuth klient zatím není v GitHub Secrets – přeskočeno."
          fi
          # Šifrovací klíč vznikne jednou přímo v Cloudflare a nikde se nevypisuje.
          if ! npx wrangler secret list $ENVFLAG --format json | grep -q '"TOKEN_ENCRYPTION_KEY"'; then
            openssl rand -base64 48 | tr -d '\n' | npx wrangler secret put TOKEN_ENCRYPTION_KEY $ENVFLAG
            echo "Vytvořen nový TOKEN_ENCRYPTION_KEY."
          else
            echo "TOKEN_ENCRYPTION_KEY už existuje – beze změny."
          fi

      - name: Kontrola živé adresy
        run: |
          if [ "$TARGET" = "production" ]; then NAME=o-putovni-pohar-api; else NAME=o-putovni-pohar-api-test; fi
          URL="https://$NAME.marek-fikejs.workers.dev"
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$URL/api/health" -o health.json; then break; fi; sleep 5
          done
          cat health.json; echo
          grep -q '"ok":true' health.json
          grep -q '"teams":10' health.json
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/public"); echo "public: $code"; test "$code" = 200
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/admin/me"); echo "admin bez přihlášení: $code"; test "$code" = 401
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/api/auth/login" -H 'Content-Type: application/json' -d '{"email":"nikdo@example.com","password":"spatne-heslo-1"}'); echo "login se špatným heslem: $code"; test "$code" = 401
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/order" -H 'X-Order-Token: aaaaaa'); echo "neplatný odkaz týmu: $code"; test "$code" = 404
          echo "API_URL=$URL" >> "$GITHUB_STEP_SUMMARY"
