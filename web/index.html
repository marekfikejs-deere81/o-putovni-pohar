<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="loga/web/VLA.png">
<title>O putovní pohár · HC Rytíři Vlašim</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f6fa;color:#10233f}
  header{background:#10335c;color:#fff;padding:16px 18px;display:flex;gap:12px;align-items:center}
  header img{width:52px;height:52px;background:#fff;border-radius:10px;object-fit:contain;padding:3px}
  header small{opacity:.8;letter-spacing:.04em;text-transform:uppercase;font-size:12px}
  header h1{margin:2px 0;font-size:22px}
  .note{margin:14px 16px;padding:10px 12px;background:#fff7e0;border:1px solid #f0d58a;border-radius:10px;font-size:14px}
  h2{margin:18px 16px 8px;font-size:18px}
  .slot{margin:0 12px 6px}
  .time{background:#1f5fae;color:#fff;font-weight:700;padding:6px 10px;border-radius:8px 8px 0 0;font-size:14px}
  .games{background:#fff;border-radius:0 0 8px 8px;padding:6px 10px}
  .row{display:grid;grid-template-columns:22px 1fr auto 1fr;align-items:center;gap:6px;padding:5px 0;font-size:14px}
  .row+.row{border-top:1px solid #e6ebf2}
  .rink{font-weight:800;color:#1f5fae}
  .t{display:flex;align-items:center;gap:6px}
  .t.r{justify-content:flex-end;text-align:right}
  .t img{width:24px;height:24px;object-fit:contain;flex:none}
  .t span{white-space:nowrap;line-height:1.2}
  .x{color:#7a8aa3}
  .event{font-style:italic;color:#4a5d7a}
  footer{padding:20px 16px;font-size:12px;color:#6a7b95}
</style>
</head>
<body>
<header>
  <img src="loga/web/VLA.png" alt="HC Rytíři Vlašim">
  <div><small>HC Rytíři Vlašim · 2. třídy</small><h1>O putovní pohár</h1><div>Vánoční turnaj · 28.&nbsp;12.&nbsp;2026</div></div>
</header>
<div class="note">Web turnaje se připravuje. Zatím zde je oficiální rozpis zápasů.</div>
<h2>Program</h2>
<main id="program">Načítání rozpisu…</main>
<footer id="build"></footer>
<script type="module">
  const [teams, blocks] = await Promise.all(['data/tymy.json', 'data/harmonogram.json'].map((u) => fetch(u).then((r) => r.json())));
  const byCode = new Map(teams.map((t) => [t.code, t]));
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const side = (code, right) => {
    const t = byCode.get(code);
    if (!t) return `<span class="t${right ? ' r' : ''}">${esc(code[0])}. ze skupiny ${esc(code[1])}</span>`;
    const img = `<img src="${esc(t.web)}" alt="">`;
    const name = `<span>${t.lines.map(esc).join('<br>')}</span>`;
    return `<span class="t${right ? ' r' : ''}">${right ? '' : img}${name}${right ? img : ''}</span>`;
  };
  document.getElementById('program').innerHTML = blocks.map((b) => {
    const label = b.games.length ? (b.games.some((g) => g.place) ? 'Utkání o umístění' : 'Skupiny') : '';
    const body = b.games.length
      ? b.games.map((g) => `<div class="row"><span class="rink">${esc(g.rink)}</span>${side(g.home)}<span class="x">${g.place ? 'o ' + g.place + '. m.' : '×'}</span>${side(g.away, true)}</div>`).join('')
      : `<div class="event">${esc(b.title)}</div>`;
    return `<section class="slot"><div class="time">${esc(b.start)}–${esc(b.end)}${label ? ' · ' + label : ''}</div><div class="games">${body}</div></section>`;
  }).join('');
  try {
    const c = await fetch('config.json').then((r) => r.json());
    document.getElementById('build').textContent = `Verze ${c.commit.slice(0, 7)} · ${new Date(c.builtAt).toLocaleString('cs-CZ', { timeZone: 'Europe/Prague' })}`;
  } catch {}
</script>
</body>
</html>
