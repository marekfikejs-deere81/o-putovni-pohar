 14 minut s pravidelným střídáním po jedné minutě. Po skončení každé třetiny budou provedeny samostatné nájezdy za fauly odpískané v průběhu dané třetiny. Za každý odpískaný faul získává soupeř jeden samostatný nájezd, který provede faulovaný hráč. Výsledek těchto nájezdů se započítává do skóre utkání. BODOVÁNÍ Bodovat se bude každou třetinu zvlášť: výhra v základní hrací době – 2 body remíza v základní hrací době – 1 bod prohra v základní hrací době – 0 bodů</p></details><details><summary>Pořadí ve skupinách</summary><p><b>Upřesnění pořadatele.</b> Při shodě bodů dvou týmů rozhoduje součet branek obou třetin jejich vzájemného zápasu. Při shodném skóre rozhoduje celkový rozdíl branek ve skupině, vyšší počet vstřelených branek, nižší počet obdržených branek a nakonec los pořadatele. Pokud se v minitabulce oddělí ostatní týmy a dvojice zůstane shodná, posoudí se znovu podle skóre svého vzájemného zápasu.</p><p>POŘADÍ V ZÁKL. SKUPINÁCH O pořadí týmů rozhoduje počet získaných bodů. Při rovnosti bodů rozhodují postupně: výsledek vzájemného utkání, rozdíl vstřelených a obdržených branek, vyšší počet vstřelených branek, nižší počet obdržených branek, los pořadatele. Při rovnosti bodů tří a více týmů bude pro dotčené týmy vytvořena minitabulka jejich vzájemných utkání.</p></details><details><summary>Utkání o umístění</summary><p>UTKÁNÍ O UMÍSTĚNÍ Výsledky utkání o konečné umístění určují konečné pořadí týmů na turnaji. Tato utkání musí znát vítěze. V případě shodnosti bodů po základní hrací době, rozhodnou o vítězi samostatné nájezdy. Každý tým určí 3 hráče, kteří provedou po jednom nájezdu. Pokud nebude rozhodnuto ani po této sérii, pokračují nájezdy systémem náhlé smrti, po jedné sérii. Při zahájení náhlé smrti se obrací pořadí týmů oproti úvodní sérii. Utkání končí, jakmile po stejném počtu provedených nájezdů získá jeden tým rozhodující náskok. Hráči provádějící nájezd se nesmí opakovat, dokud nájezd neprovedou všichni hráči v týmu.</p></details><details><summary>Startovné a ceny</summary><p>STARTOVNÉ Startovné činí 8 000 Kč za tým a zahrnuje: zajištění ledové plochy, časomíru a organizaci utkání, rozhodčí, poháry, medaile a diplomy, občerstvení pro hráče do kabiny, zdravotnickou službu. CENY Každý zúčastněný tým obdrží sadu medailí pro hráče. Týmy na 1., 2. a 3. místě obdrží pohár. Vítěz turnaje obdrží PUTOVNÍ POHÁR.</p></details><details><summary>Stravování a fair play</summary><p>STRAVOVÁNÍ Pořadatel nabízí možnost objednání oběda pro hráče a členy realizačních týmů. (polévka, hlavní jídlo, pití) Počet obědů je nutné objednat předem nejpozději do 12. 12. 2026. Kontakt pro objednání obědů: Martin Kakos +420 732 773 346. FAIR PLAY Turnaj je pořádán především pro děti. Jeho hlavním cílem je radost ze hry, získávání zkušeností a podpora sportovního chování. Trenéři, rodiče a ostatní doprovod jsou žádáni, aby respektovali rozhodčí, soupeře i všechny mladé hráče a pomohli vytvořit pozitivní sportovní atmosféru.</p></details><details><summary>Organizační pravidla</summary><p>ORGANIZAČNÍ A DISCIPLINÁRNÍ USTANOVENÍ Vedoucí jednotlivých týmů odpovídají za své hráče po celou dobu konání turnaje. Každý tým bude mít dvě sady dresů, světlé a tmavé. Rozhodnutí rozhodčího během utkání je konečné. Případné organizační nebo sporné situace, které nejsou výslovně upraveny těmito propozicemi, řeší hlavní pořadatel turnaje. Hrubé nesportovní chování hráčů, trenérů, členů realizačních týmů nebo doprovodu nebude tolerováno.</p></details>",groups=[[0,2,3,5,9],[1,6,7,4,8]];

const clubNames=new Map(clubLines.map(pair=>[pair.join(' '),pair]));
function rowTeam(i){
 const words=teams[i].n.trim().split(/\s+/);

 else if(lines[0].length>10&&words.length>1){

 return '<span class="rowteam">'+logo(i)+'<span class="teamLabel">'+lines.map(line=>'<span>'+escapeText(line)+'</span>').join(' ')+'</span></span>';

let pairs=[],places=[],agenda=[];
const groupCount=()=>pairs.length*2;
function pairings(n){
 if(n===5)return originalPairs;
 const ring=Array.from({length:n},(_,i)=>i),matches=[];
 if(n%2)ring.push(null);
 for(let round=1;round<ring.length;round++){
  for(let i=0;i<ring.length/2;i++){
   const a=ring[i],b=ring[ring.length-1-i];
   if(a!==null&&b!==null)matches.push([a,b]);
  }
  ring.splice(1,0,ring.pop());
 }
 return matches;
}
function groupGames(g){return pairs.map(([a,b],j)=>({key:2*j+g,a:groups[g][a],b:groups[g][b]}))}

function stats(ids,games){
 const rows=Object.fromEntries(ids.map(i=>[i,{i,p:0,f:0,a:0,z:0}]));
 for(const {key,a,b} of games){if(!rows[a]||!rows[b])continue;
  for(const [x,y] of halves(key)){rows[a].f+=x;rows[b].a+=x;rows[b].f+=y;rows[a].a+=y;rows[a].p+=1+Math.sign(x-y);rows[b].p+=1+Math.sign(y-x)}
  if(halves(key).length===2){rows[a].z++;rows[b].z++}
 }return rows
}

function splitBy(ids, value){
 const buckets=new Map();
 for(const id of ids){
  const key=value(id);
  if(!buckets.has(key))buckets.set(key,[]);
  buckets.get(key).push(id);
 }
 return [...buckets.keys()].sort((a,b)=>b-a).map(key=>buckets.get(key));
}
let manualOrder=null,orderDraft=null,orderReview=false;
function validOrder(order){
 return Array.isArray(order)&&order.length===2&&groups.every((ids,g)=>{
  const row=order[g];
  return Array.isArray(row)&&row.length===ids.length&&new Set(row).size===ids.length&&ids.every(id=>row.includes(id));
 });
}
function ranking(g){
 const rows=ruleRanking(g);
 if(!manualOrder)return rows;
 return manualOrder[g].map((id,i)=>({...rows.find(r=>r.i===id),rank:i+1,tie:false}));
}
// Hodnoty kritérií se porovnávají sestupně. U obdržených branek je lepší menší počet.
function goalCriteria(rows){
 return [i=>rows[i].f-rows[i].a, i=>rows[i].f, i=>-rows[i].a];
}
function ruleRanking(g){
 const games=groupGames(g), all=stats(groups[g],games);
 function resolve(ids){
  if(ids.length===1)return [ids];
  const mutualGames=games.filter(m=>ids.includes(m.a)&&ids.includes(m.b)&&halves(m.key).length>0);
  const mini=stats(ids,mutualGames);
  const criteria=ids.length===2
   ? (mutualGames.length?[i=>mini[i].f-mini[i].a]:[])
   : [i=>mini[i].p,...goalCriteria(mini)];
  for(const criterion of [...criteria,...goalCriteria(all)]){
   const buckets=splitBy(ids,criterion);
   if(buckets.length>1)return buckets.flatMap(resolve);
  }
  return splitBy(ids,i=>-(lots[g][i]??99));
 }
 const buckets=splitBy(groups[g],i=>all[i].p).flatMap(resolve);
 let position=1;
 return buckets.flatMap(ids=>{
  const rank=position;
  position+=ids.length;
  return ids.map(i=>({...all[i],rank,tie:ids.length>1}));
 });
}
const finished=()=>Array.from({length:groupCount()},(_,i)=>halves(i).length===2).every(Boolean);
function finalists(place){if(!manualOrder&&!finished())return [];let r=(place+1)/2;return [0,1].map(g=>ranking(g).find(x=>x.rank===r&&!x.tie)?.i)}

function game(k){if(k<groupCount())return groupGames(k%2)[Math.floor(k/2)];const p=places[k-groupCount()],[a,b]=finalists(p);return {key:k,a,b,p}}
const clock=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');

 let x=0,y=0;for(const pair of h){x+=pair[+reverse];y+=pair[1-Number(reverse)]}
 return x+':'+y
}

function halfResults(k,reverse=false){
 return [0,1].map(i=>{
  const goals=halves(k)[i];
  if(!goals)return {score:'—',points:'—'};
  const x=goals[reverse?1:0],y=goals[reverse?0:1];

  return {score:x+':'+y,points:(1+outcome)+':'+(1-outcome)};
 });
}

 return '<small>Nahoře je první třetina, pod čarou druhá. Pod každým skóre jsou body (b.). První číslo patří týmu vlevo.</small><div class="matrixScroll"><table class="matrix"><tr><th>Tým</th>'+ids.map(i=>'<th><span aria-label="'+name(i)+'">'+logo(i)+'</span></th>').join('')+'</tr>'+ids.map(i=>'<tr><th scope="row">'+rowTeam(i)+totals.get(i)+'</th>'+ids.map(j=>{if(i===j)return '<td class="diag">×</td>';const m=games.find(m=>(m.a===i&&m.b===j)||(m.a===j&&m.b===i));return '<td'+(active(m.key)?' class="live"':'')+'><button onclick="detail('+m.key+','+(m.b===i)+')" aria-label="'+name(i)+' proti '+name(j)+'">'+matrixResult(m.key,m.b===i)+(active(m.key)?'<em>Hraje</em>':'')+'</button></td>'}).join('')+'</tr>').join('')+'</table></div><small>— čeká na zápis　Hraje = aktuální dvojice podle programu</small>'
}

const rinkNames={A:'pod časomírou',B:'pod restaurací'};
function rinkOf(k){
 if(k<groupCount())return 'AB'[k%2];
 return game(k).p===1||game(k).p%4===3?'A':'B';
}
function buildSchedule(){
 const n=groups[0].length;
 pairs=pairings(n);
 places=Array.from({length:n},(_,i)=>2*(n-i)-1);
 const blocks=pairs.map((_,j)=>[2*j,2*j+1]);
 const placement=[];
 for(let place=3;place<=2*n-1;place+=4){
  placement.unshift([place,place+2].filter(p=>places.includes(p)).map(p=>groupCount()+places.indexOf(p)));
 }
 blocks.push(...placement,[groupCount()+n-1]);
 agenda=[];
 blocks.forEach((games,j)=>{
  const from=agenda.at(-1)?.to??480,to=from+35;
  agenda.push({from,to,games});
  if(j%2===1&&j<blocks.length-1){
   const noon=n===5&&j===5;
   agenda.push({from:to,to:to+(noon?20:15),title:noon?'Úprava ledu + polední pauza':'Úprava ledu'});
  }
 });
 agenda.push({from:agenda.at(-1).to,to:agenda.at(-1).to+50,title:'Vyhlášení výsledků a předání cen',last:true});
}
buildSchedule();

const prague=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Prague',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function slotAt(now){
 const d=Object.fromEntries(prague.formatToParts(now).map(x=>[x.type,x.value]));
 if(d.year+d.month+d.day!=='20261228')return null;
 const minute=60*Number(d.hour)+Number(d.minute);
 return agenda.find(e=>e.from<=minute&&minute<e.to)||null;
}

function reportSections(){
 const div=document.createElement('div');div.innerHTML=info;
 const parts=[{title:'Propozice turnaje',items:[]}];
 const intro=parts[0].items;
 for(const block of div.querySelectorAll('details')){
  intro.push([block.querySelector('summary').textContent,'heading']);

 }
 intro.push(['Turnajové menu','heading'],['Hovězí vývar, špagety s boloňskou omáčkou a šťáva. Cena jedné porce je 170 Kč. Objednávky do 12. 12. 2026.']);
 function match(m){
  const k=m.key,a=m.a===undefined?label(m,'a'):teams[m.a].n,b=m.b===undefined?label(m,'b'):teams[m.b].n;
  const e=eventFor(k),out=[[clock(e.from)+'  ·  Plocha '+rinkOf(k)+'  ·  '+a+' × '+b,'heading']];
  if(!halves(k).length)return [...out,['Výsledek dosud nezapsán.']];
  const h=halfResults(k);
  out.push(['1. třetina  '+h[0].score+'  ('+h[0].points+' b.)     |     2. třetina  '+h[1].score+'  ('+h[1].points+' b.)']);
  const total=halves(k).reduce((sum,[x,y])=>sum+1+Math.sign(x-y),0);
  out.push(['Skóre celkem '+score(k)+'  ·  body '+total+':'+(2*halves(k).length-total)+(halves(k).length===1?'  ·  zapsána jen první třetina':'')]);
  if(m.p&&results[k]?.winner!==undefined)out.push(['Vítěz'+(total===2?' po nájezdech':'')+': '+teams[results[k].winner].n]);
  return out;
 }
 groups.forEach((_,g)=>{
  const rows=ranking(g),items=[['Pořadí skupiny '+('AB'[g])+(manualOrder?' podle rozhodnutí pořadatele':''),'heading']];
  rows.forEach(r=>items.push([r.rank+'.  '+teams[r.i].n+'  ·  odehráno '+r.z+'/'+(groups[g].length-1)+'  ·  skóre '+r.f+':'+r.a+'  ·  '+r.p+' b.']));
  items.push(...groupGames(g).flatMap(match));parts.push({title:'Výsledky skupiny '+('AB'[g]),items});
 });
 parts.push({title:'Zápasy o umístění',items:places.flatMap((p,i)=>[['O '+p+'. místo','heading'],...match(game(groupCount()+i))])});
 const end=[];
 [...places].reverse().forEach(p=>{const k=groupCount()+places.indexOf(p),m=game(k),w=results[k]?.winner;
  if(Number.isInteger(w)){end.push([p+'.  '+teams[w].n,'heading'],[(p+1)+'.  '+teams[w===m.a?m.b:m.a].n,'heading'])}
  else end.push([p+'. a '+(p+1)+'. místo: výsledek dosud nezapsán.']);
 });
 parts.push({title:'Konečné pořadí turnaje',items:end});return parts;
}

 }
 for(const part of reportSections()){

  for(const [text,kind] of part.items){
   const z=kind?12:10.6;if(kind&&y<100)newPage();if(kind)y-=6;
   let line='';const lines=[];
   for(const word of text.split(/\s+/)){const next=line?line+' '+word:word;if(line&&width(next,z)>510){lines.push(line);line=word}else line=next}

function changePlan(index,edge,newTime,now=tournamentMinute()){
 const e=agenda[index];
 if(!e||!Number.isInteger(newTime)||!['from','to'].includes(edge))throw Error('Vyber událost a platný čas.');
 const current=e.from<=now&&now<e.to, recorded=e.games?.some(k=>halves(k).length);
 if(e.to<=now||agenda.slice(index+1).some(x=>x.games?.some(k=>halves(k).length)))throw Error('Tato změna by zasáhla do minulosti nebo do zapsaného výsledku.');
 if(edge==='from'&&(recorded||current&&e.title))throw Error('U probíhající události uprav konec.');
 if(edge==='to'&&(e.last||e.games?.every(k=>halves(k).length===2)))throw Error('Konec této události už nelze měnit.');
 const delta=newTime-e[edge];if(!delta)throw Error('Zadej nový čas.');
 if(newTime<Math.max(0,now)||edge==='from'&&index&&newTime<agenda[index-1].to||edge==='to'&&newTime<=e.from)throw Error('Čas zasahuje do minulosti nebo sousedního bloku.');
 const next=agenda.map((x,i)=>i<index?{...x}:{...x,from:x.from+(i===index&&edge==='to'?0:delta),to:x.to+delta});
 if(next.some(x=>x.from<0||x.from>=x.to||x.to>1440))throw Error('Harmonogram musí zůstat v rámci dne turnaje.');
 const meals=lunchRows(next),before=lunchRows();
 meals.forEach((l,n)=>{
  if(before[n].from<=now&&(l.from!==before[n].from||l.to!==before[n].to))throw Error('Změna by posunula již zahájený oběd.');
  if(next.some(x=>x.games&&x.from<l.to&&l.from<x.to&&x.games.some(k=>{const m=game(k);return l.ids.includes(m.a)||l.ids.includes(m.b)})))throw Error('Vznikla by kolize oběda se zápasem stejného týmu.');
  if(n&&meals[n-1].to>l.from)throw Error('Vznikl by překryv rezervací týmových stolů.');
 });
 return next
}
