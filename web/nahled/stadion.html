async function crest(src){
 if(approvedCrests[src])return approvedCrests[src];
 const img=new Image();img.src=src;await img.decode();
 const scale=Math.min(1,768/Math.max(img.width,img.height));
 const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
 const ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height;
 ctx.drawImage(img,0,0,w,h);
 const pixels=ctx.getImageData(0,0,w,h),d=pixels.data,seen=new Uint8Array(w*h),queue=[];
 function add(i){if(seen[i])return;seen[i]=1;const j=i*4;if(d[j+3]<20||Math.min(d[j],d[j+1],d[j+2])>=231){queue.push(i);d[j+3]=0}}
 for(let x=0;x<w;x++){add(x);add((h-1)*w+x)}
 for(let y=0;y<h;y++){add(y*w);add(y*w+w-1)}
 for(let k=0;k<queue.length;k++){const i=queue[k];if(i%w)add(i-1);if(i%w<w-1)add(i+1);if(i>=w)add(i-w);if(i+w<w*h)add(i+w)}
 ctx.putImageData(pixels,0,0);
 let left=w,top=h,right=-1,bottom=-1;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(d[(y*w+x)*4+3]>32){left=Math.min(left,x);right=Math.max(right,x);top=Math.min(top,y);bottom=Math.max(bottom,y)}}
 if(right<left)return src;
 const crop=document.createElement('canvas');crop.width=right-left+1;crop.height=bottom-top+1;
 crop.getContext('2d').drawImage(canvas,-left,-top);return crop.toDataURL();
}

}}

function periodRecord(table,id){
 let wins=0,draws=0,losses=0;
 for(const k of table.games){
  const m=data.matches[k];
  if(m.a!==id&&m.b!==id)continue;
  for(const [a,b] of m.periods){
   const diff=m.a===id?a-b:b-a;
   if(diff>0)wins++;else if(diff<0)losses++;else draws++;
  }
 }
 return [wins+draws+losses,wins,draws,losses];
}

 else if(slide>=0){header=time(b.from)+'–'+time(b.to)+'  ·  '+b.title;next=blocks.slice(i+1).find(x=>x.games.length)||next;html=stadiumPanel(slide%2,next,minute,slide>=2)}

 const matrix=slide===0||slide===1;document.body.classList.toggle('cross',slide>=0);
 el('head').textContent=matrix?'Křížová · skupina '+'AB'[slide]:(sample?'UKÁZKA · ':'')+header;el('screen').innerHTML=html;el('next').innerHTML=b?.last?'<strong>Konec programu v '+time(b.to)+'</strong>':upcoming(next,minute,day,matrix);showCrests();
}
async function refresh(){
 if(loading)return;loading=true;
 try{const r=await fetch('arena.json',{cache:'no-store',headers:etag?{'If-None-Match':etag}:{},signal:AbortSignal.timeout(10000)});if(r.status!==304&&!r.ok)throw Error();
 const server=Number(r.headers.get('X-Arena-Time'));if(server)offset=server-Date.now();
 if(r.status!==304){const incoming=await r.json();data=incoming;etag=r.headers.get('etag');version++;try{localStorage.setItem('arena-last-v2',JSON.stringify(data))}catch{}}
 lastOK=Date.now();el('signal').textContent='';tick()
 }catch{el('signal').textContent=data?'Offline · poslední načtené údaje':'Čeká se na připojení'}finally{loading=false}
}
function controls(){document.body.classList.remove('quiet');clearTimeout(hideTimer);hideTimer=setTimeout(()=>document.body.classList.add('quiet'),4500)}
el('full').onclick=async()=>{try{await document.documentElement.requestFullscreen()}catch{el('full').textContent='Použij F11'}};document.onpointermove=controls;document.onpointerdown=controls;controls();
try{data=JSON.parse(localStorage.getItem('arena-last-v2'));if(data)tick()}catch{data=null}
refresh();setInterval(refresh,4000);setInterval(tick,500);window.addEventListener('online',refresh);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script></html>
