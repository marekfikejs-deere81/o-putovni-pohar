// Stadionová obrazovka 1600×960. Vzhled z prototypu; data z /api/public (stejná revize jako mobilní web).
// Opravy proti prototypu: žádné dodatečné odstraňování bílé ze znaků (dodaná stadionová PNG jsou schválená),
// zkratky a barvy týmů z dat (ne natvrdo), obnova po 5 s, serverový čas pro synchronizaci.
const DAY = '20261228';
const demo = new URLSearchParams(location.search).get('ukazka'), sample = ['zapas', 'led', 'cislice', 'krizova', 'poradi'].includes(demo);
let api = '', data = null, etag = '', offset = 0, version = 0, lastKey = '', loading = false, start = Date.now(), hideTimer;
const el = (id) => document.getElementById(id), esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const time = (n) => String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(Math.floor(n % 60)).padStart(2, '0');
const fmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Prague', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });

/** Převod veřejného modelu na tvar, se kterým pracuje vykreslování stadionu. */
function toArena(M) {
  const clubs = Object.fromEntries(M.teams.map((t) => [t.id, { name: t.name, img: t.logo.stadium, code: t.code, color: t.color }]));
  const matches = [];
  for (const m of M.matches) {
    matches[m.id] = {
      rink: m.rink, a: m.home ?? null, b: m.away ?? null,
      seed: m.place ? Number(m.homeSeed[0]) : 0, place: m.place || 0, periods: m.periods, winner: m.winner,
    };
  }
  const blocks = M.blocks.map((b, i) => ({ from: b.from, to: b.to, games: b.games, title: b.title, last: i === M.blocks.length - 1 }));
  const tables = ['A', 'B'].map((g) => {
    const ids = M.groups[g].order; // Vlašim vždy první
    const games = M.matches.filter((m) => m.place === null && ids.includes(m.home)).map((m) => m.id);
    const rank = M.groups[g].rows.map((r) => ({ id: r.id, rank: r.rank, z: r.played, p: r.points, f: r.goalsFor, a: r.goalsAgainst }));
    return { ids, games, rank, started: M.groups[g].started };
  });
  return { clubs, matches, blocks, tables };
}

function timer(now) {
  const d = Object.fromEntries(fmt.formatToParts(new Date(now)).map((x) => [x.type, x.value]));
  if (sample) { const b = data.blocks.find((e) => (demo !== 'zapas' ? (!e.games.length && !e.last) : e.games.length)); if (b) return { day: DAY, sec: b.from * 60 + Math.floor((Date.now() - start) / 1000) % ((b.to - b.from) * 60) }; }
  // ?rotace=1 – zkouška obrazovky se skutečnými daty: střídá zápasy a úpravu ledu (křížové tabulky a pořadí) dokola.
  if (new URLSearchParams(location.search).has('rotace')) {
    const games = data.blocks.filter((e) => e.games.length), ice = data.blocks.find((e) => !e.games.length && !e.last);
    const plan = [[games[0], 12], [games[Math.floor(games.length / 2)], 12], [ice, 40], [games.at(-2) || games.at(-1), 12], [games.at(-1), 12]].filter((x) => x[0]);
    const total = plan.reduce((t, x) => t + x[1], 0);
    let t = Math.floor((Date.now() - start) / 1000) % total;
    for (const [b, len] of plan) { if (t < len) return { day: DAY, sec: b.from * 60 + t }; t -= len; }
  }
  const test = new URLSearchParams(location.search).get('cas'); // jen pro testování: ?cas=HH:MM
  if (test && /^\d{1,2}:\d{2}$/.test(test)) { const [h, mi] = test.split(':').map(Number); return { day: DAY, sec: h * 3600 + mi * 60 + Math.floor((Date.now() - start) / 1000) }; }
  return { day: d.year + d.month + d.day, sec: +d.hour * 3600 + (+d.minute) * 60 + (+d.second) };
}
const name = (m, side) => (m[side] === null ? m.seed + '. ze skupiny ' + (side === 'a' ? 'A' : 'B') : data.clubs[m[side]].name);
function lane(e, r) { const k = e.games.find((i) => data.matches[i].rink === r); return k === undefined ? null : data.matches[k]; }
function clubMark(id, placeholder = '?') {
  const club = data.clubs[id];
  if (!club?.img) return '<b>' + esc(placeholder) + '</b>';
  const squad = club.name.match(/Vlašim\s+([AB])$/i);
  return '<span class="mark"><img src="' + esc(club.img) + '" alt="' + esc(club.name) + '">' + (squad ? '<b>' + squad[1] + '</b>' : '') + '</span>';
}
const code = (id) => data.clubs[id]?.code || data.clubs[id]?.name.slice(0, 4) || '—';
const color = (id) => data.clubs[id]?.color || '#fff';
const isHome = (id) => /Vlašim/i.test(data.clubs[id]?.name || '');
function codeMark(id, fallback) {
  if (id == null) return esc(fallback);
  return '<span class="teamcode" style="--team:' + esc(color(id)) + '" title="' + esc(data.clubs[id].name) + '">' + esc(code(id)) + '</span>';
}
function upcoming(b, minute, day, codes = false) {
  if (!b) return '<strong>Turnaj zakončen</strong>';
  if (!b.games.length) return '<strong>Následuje</strong><div>' + esc(b.title) + '</div>';
  const pair = (r) => {
    const m = lane(b, r);
    if (!m) return '<div class="pair">Volno</div>';
    const mark = (k) => (codes ? codeMark(m[k], name(m, k)) : clubMark(m[k], name(m, k)));
    return '<div class="pair">' + mark('a') + '<span>×</span>' + mark('b') + '</div>';
  };
  const remaining = day === DAY ? 'Za ' + Math.max(0, Math.ceil(b.from - minute)) + ' min' : '28. prosince';
  return '<div class="ready">' + pair('A') + '<div class="start"><strong>Připraví se</strong><time>' + time(b.from) + '</time><span>' + remaining + '</span></div>' + pair('B') + '</div>';
}
function rink(e, r) {
  const m = lane(e, r);
  if (!m) return '<article class="rink"><b class="idle">Volno</b></article>';
  const side = (k) => { const img = data.clubs[m[k]]?.img; return '<div class="side">' + (img ? '<img src="' + esc(img) + '" alt="">' : '') + '<span>' + esc(name(m, k)) + '</span></div>'; };
  const goals = m.periods.reduce(([a, b], [x, y]) => [a + x, b + y], [0, 0]);
  const result = m.periods.length ? '<span class="result">' + goals.join(':') + ' po ' + m.periods.length + '. poločase</span>' : '';
  return '<article class="rink">' + (m.place ? '<span class="place">O ' + m.place + '. místo</span>' : '') + result + side('a') + '<div class="score">×</div>' + side('b') + '</article>';
}
// Ukázková data (jen ?ukazka=…, nikdy se neukládají)
const examplePeriods = [[[2, 1], [0, 0]], [[1, 3], [2, 2]], [[4, 1], [1, 2]], [[0, 2], [3, 1]], [[2, 2], [0, 1]], [[1, 0], [2, 4]], [[3, 2], [1, 1]], [[0, 3], [4, 2]], [[2, 0], [3, 1]], [[1, 2], [0, 0]]];
const rankExample = [[{ id: 9, rank: 1, record: [8, 4, 2, 2], p: 10, f: 13, a: 12 }, { id: 0, rank: 2, record: [8, 3, 3, 2], p: 9, f: 10, a: 9 }, { id: 2, rank: 3, record: [8, 4, 1, 3], p: 9, f: 14, a: 10 }, { id: 3, rank: 4, record: [8, 3, 1, 4], p: 7, f: 14, a: 16 }, { id: 5, rank: 5, record: [8, 1, 3, 4], p: 5, f: 11, a: 15 }],
  [{ id: 4, rank: 1, record: [8, 4, 3, 1], p: 11, f: 14, a: 11 }, { id: 6, rank: 2, record: [8, 4, 1, 3], p: 9, f: 14, a: 13 }, { id: 1, rank: 3, record: [8, 3, 2, 3], p: 8, f: 13, a: 11 }, { id: 8, rank: 4, record: [8, 3, 1, 4], p: 7, f: 13, a: 14 }, { id: 7, rank: 5, record: [8, 1, 3, 4], p: 5, f: 8, a: 13 }]];
function periodRecord(table, id) {
  let wins = 0, draws = 0, losses = 0;
  for (const k of table.games) {
    const m = data.matches[k];
    if (m.a !== id && m.b !== id) continue;
    for (const [a, b] of m.periods) { const diff = m.a === id ? a - b : b - a; if (diff > 0) wins++; else if (diff < 0) losses++; else draws++; }
  }
  return [wins + draws + losses, wins, draws, losses];
}
function stadiumPanel(group, next, minute, standings) {
  const table = data.tables[group], ids = table.ids;
  const rect = (x, y, w, h, fill, rx = 0) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" rx="${rx}"/>`;
  const label = (x, y, value, size, col = '#fff', align = 'middle') => `<text x="${x}" y="${y}" font-size="${size}" fill="${col}" text-anchor="${align}">${esc(value)}</text>`;
  const palette = ['#14863a', '#494949', '#af2222'];
  const parts = ['<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" font-family="DejaVu Sans, Verdana, sans-serif" font-weight="bold" role="img" aria-label="' + (standings ? 'Pořadí' : 'Křížová') + ' tabulka skupiny ' + 'AB'[group] + '">', rect(0, 0, 1600, 960, 'black')];
  parts.push(label(40, 73, (standings ? 'Pořadí' : 'Křížová') + ' · skupina ' + 'AB'[group], standings ? 56 : 53, 'white', 'start'), label(1360, 77, 'Čas', 39, 'white', 'end'), label(1560, 76, time(Math.floor(minute)), 62, '#65fa93', 'end'), rect(0, 106, 1600, 4, '#5cb5f8'));
  if (standings) {
    const sampleRank = demo === 'poradi' && rankExample[group];
    const rows = sampleRank || table.rank;
    const started = sampleRank || demo === 'cislice' || table.started;
    const xs = [841, 948, 1055, 1162, 1332, 1524];
    const grey = '#adb5c1';
    parts.push(label(122, 164, 'Tým', 40, grey, 'start'));
    ['Z', 'V', 'R', 'P', 'Skóre', 'B'].forEach((v, i) => parts.push(label(xs[i], 164, v, 40, grey)));
    const height = 590 / rows.length;
    rows.forEach((r, i) => {
      const id = r.id, y = 185 + (i + 0.5) * height, base = y + 22;
      const record = sampleRank ? r.record : periodRecord(table, id);
      const stress = demo === 'cislice';
      const vals = stress ? [8, 5, 2, 1, '55:55', 12] : started ? [...record, r.f + ':' + r.a, r.p] : [0, 0, 0, 0, '–', '–'];
      const fullName = data.clubs[id]?.name || '—';
      const nameSize = Math.min(56, Math.floor(620 / (Math.max(1, fullName.length) * 0.62)), height * 0.5);
      parts.push(label(52, base, started ? (stress ? i + 1 : r.rank) + '.' : '–', 65, grey), rect(122, y - 35, 22, 70, color(id), 4), label(164, base, fullName, nameSize, isHome(id) ? '#96d4ff' : 'white', 'start'));
      vals.forEach((v, j) => parts.push(label(xs[j], base, v, Math.min(j === 5 ? 70 : 64, height * 0.64, (j === 4 ? 205 : 91) / (String(v).length * 0.67)), j === 5 ? '#ffd268' : 'white')));
      if (i < rows.length - 1) parts.push(rect(0, y + height / 2 - 2, 1600, 3, '#343434'));
    });
  } else {
    [681, 840, 1016].forEach((x, i) => parts.push(rect(x, 36, 34, 34, palette[i], 6), label(x + 44, 66, ['výhra', 'remíza', 'prohra'][i], 30, 'white', 'start')));
    const col = 1338 / ids.length, row = 540 / ids.length;
    ids.forEach((id, i) => {
      const x = 241 + (i + 0.5) * col - 12, cy = 194 + (i + 0.5) * row - 4;
      parts.push(rect(x - 63, 131, 16, 52, color(id), 3), label(x - 32, 170, code(id), 46, 'white', 'start'), rect(48, cy - 26, 16, 52, color(id), 3), label(78, cy + 15, code(id), 53, isHome(id) ? '#96d4ff' : 'white', 'start'));
      ids.forEach((opp, j) => {
        const left = 241 + j * col, top = 194 + i * row, cw = col - 21, ch = row - 8;
        if (id === opp) { parts.push(rect(left, top, cw, ch, '#161616', 8), label(left + cw / 2, cy + 13, '×', 47, '#464646')); return; }
        const idx = table.games.findIndex((k) => { const m = data.matches[k]; return (m.a === id && m.b === opp) || (m.b === id && m.a === opp); });
        const m = data.matches[table.games[idx]];
        const periods = !m ? [] : ['krizova', 'poradi'].includes(demo) ? examplePeriods[(idx + 3 * group) % examplePeriods.length] : demo === 'cislice' ? [[55, 55], [55, 55]] : m.periods;
        for (let k = 0; k < 2; k++) {
          const h = periods[k], a = h?.[+(m?.b === id)], b = h?.[+(m?.a === id)], score = h ? a + ':' + b : '—', w = (cw - 14) / 2, x = left + 2 + k * (w + 10);
          const font = Math.min(55, ch * 0.58, w / (score.length * 0.65));
          parts.push(rect(x, top + 5, w, ch - 10, h ? palette[1 - Math.sign(a - b)] : '#161616', 7), label(x + w / 2, cy + font * 0.34, score, font));

  }
  parts.push(rect(0, 776, 1600, 4, '#edb54a'));
  if (next?.games.length) {
    parts.push(label(800, 821, 'PŘIPRAVÍ SE', 38, '#f1bd52'), label(800, 895, time(next.from), 74), label(800, 945, 'Za ' + Math.max(0, Math.ceil(next.from - minute)) + ' min', 41));
    ['A', 'B'].forEach((r, i) => {
      const m = lane(next, r), cx = i ? 1295 : 318;
      if (!m) { parts.push(label(cx, 890, 'Volno', 48)); return; }
      const team = (k) => (m[k] == null ? m.seed + (k === 'a' ? 'A' : 'B') : code(m[k]));
      parts.push(label(cx - 54, 905, team('a'), 100, m.a == null ? '#fff' : color(m.a), 'end'), label(cx, 898, '×', 76, '#ccc'), label(cx + 54, 905, team('b'), 100, m.b == null ? '#fff' : color(m.b), 'start'));

function tick() {
