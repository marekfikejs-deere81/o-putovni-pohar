# Cloudflare Worker – API turnaje. Nasazuje GitHub Actions (workflow worker.yml).
# Tajemství (DATABASE_URL, NEON_AUTH_*) se nastavují přes `wrangler secret`, nikdy sem.
name = "o-putovni-pohar-api-test"
main = "src/index.js"
compatibility_date = "2026-11-01"
account_id = "56139aff8f3da503f6c2610b2d545ba7"
workers_dev = true
preview_urls = false

[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = false

[vars]
ENVIRONMENT = "test"
NEON_AUTH_URL = "https://ep-little-silence-bhp5b2vh.neonauth.c-10.eu-central-1.aws.neon.tech/neondb/auth"
OWNER_EMAIL = "marek.fikejs@gmail.com"
AUTH_ORIGIN = "https://marekfikejs-deere81.github.io"
ADMIN_PATH = "/o-putovni-pohar/admin.html"
MAIL_MODE = "test"
MAIL_TEST_RECIPIENTS = "marek.fikejs@gmail.com"
SUMMARY_AT = "2026-12-13T07:00:00Z"
ALLOWED_ORIGINS = "https://www.vlasimskypohar.cz,https://marekfikejs-deere81.github.io,http://localhost:5173"

[triggers]
crons = ["0 * * * *"]

[observability]
enabled = true

# Limit pokusů o otevření objednávky (krátké kódy): 30 požadavků za minutu na IP.
[[ratelimits]]
name = "ORDER_LIMIT"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[env.production]
name = "o-putovni-pohar-api"
workers_dev = true
preview_urls = false

[[env.production.ratelimits]]
name = "ORDER_LIMIT"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[env.production.triggers]
crons = ["0 * * * *"]

[env.production.vars]
ENVIRONMENT = "production"
NEON_AUTH_URL = "https://ep-round-brook-bhiaq2h6.neonauth.c-10.eu-central-1.aws.neon.tech/neondb/auth"
OWNER_EMAIL = "marek.fikejs@gmail.com"
AUTH_ORIGIN = "https://marekfikejs-deere81.github.io"
ADMIN_PATH = "/o-putovni-pohar/admin.html"
MAIL_MODE = "test"
MAIL_TEST_RECIPIENTS = "marek.fikejs@gmail.com"
SUMMARY_AT = "2026-12-13T07:00:00Z"
ALLOWED_ORIGINS = "https://www.vlasimskypohar.cz,https://marekfikejs-deere81.github.io"
